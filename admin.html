
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CBT Admin Dashboard</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f1f5f9;
    color: #1e293b;
}

header {
    background: #123c69;
    color: white;
    padding: 20px;
}

.container {
    max-width: 1000px;
    margin: 25px auto;
    padding: 15px;
}

.card {
    background: white;
    padding: 20px;
    border-radius: 10px;
    margin-bottom: 20px;
    box-shadow: 0 3px 10px #00000010;
}

input, select {
    width: 100%;
    padding: 12px;
    margin: 8px 0 15px;
    border: 1px solid #cbd5e1;
    border-radius: 6px;
    font-size: 15px;
}

button {
    background: #123c69;
    color: white;
    padding: 12px 18px;
    border: none;
    border-radius: 6px;
    cursor: pointer;
}

button:hover {
    background: #2563eb;
}

.stats {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 15px;
}

.stat {
    background: #eff6ff;
    padding: 18px;
    border-radius: 8px;
}

.question-item {
    background: #f1f5f9;
    padding: 15px;
    margin: 10px 0;
    border-radius: 7px;
}

.delete {
    background: #dc2626;
}

footer {
    text-align: center;
    padding: 20px;
}
</style>
</head>

<body>

<header>
    <h1>CBT ADMIN DASHBOARD</h1>
    <p>Manage your examination system</p>
</header>

<div class="container">

    <div class="card">
        <h2>Dashboard Overview</h2>

        <div class="stats">

            <div class="stat">
                <h3>0</h3>
                <p>Students</p>
            </div>

            <div class="stat">
                <h3 id="questionCount">0</h3>
                <p>Questions Added</p>
            </div>

            <div class="stat">
                <h3>4</h3>
                <p>Subjects</p>
            </div>

        </div>
    </div>

    <div class="card">

        <h2>Add Examination Question</h2>

        <form id="questionForm">

            <label>Select Subject</label>

            <select id="subject" required>
                <option value="">Choose Subject</option>
                <option>English Language</option>
                <option>Mathematics</option>
                <option>Computer Studies</option>
                <option>Basic Science</option>
            </select>

            <label>Question</label>

            <input type="text" id="question"
            placeholder="Enter your question" required>

            <label>Option A</label>
            <input type="text" id="optionA" required>

            <label>Option B</label>
            <input type="text" id="optionB" required>

            <label>Option C</label>
            <input type="text" id="optionC" required>

            <label>Option D</label>
            <input type="text" id="optionD" required>

            <label>Correct Answer</label>

            <select id="correctAnswer" required>
                <option value="">Choose correct answer</option>
                <option value="0">Option A</option>
                <option value="1">Option B</option>
                <option value="2">Option C</option>
                <option value="3">Option D</option>
            </select>

            <button type="submit">Add Question</button>

        </form>

    </div>

    <div class="card">

        <h2>Question Management</h2>

        <div id="questionList">
            No questions added yet.
        </div>

    </div>

</div>

<footer>
    <p>CBT Examination System - Admin Panel</p>
</footer>

<script>

let adminQuestions = JSON.parse(
    localStorage.getItem("adminQuestions") || "[]"
);

function displayQuestions() {

    let list = document.getElementById("questionList");

    document.getElementById("questionCount").textContent =
        adminQuestions.length;

    if (adminQuestions.length === 0) {
        list.textContent = "No questions added yet.";
        return;
    }

    list.innerHTML = "";

    adminQuestions.forEach(function(q, index) {

        let item = document.createElement("div");
        item.className = "question-item";

        let title = document.createElement("strong");
        title.textContent = q.subject + ": " + q.question;

        let details = document.createElement("p");
        details.textContent =
            "Correct answer: " + q.options[q.answer];

        let deleteButton = document.createElement("button");
        deleteButton.textContent = "Delete";
        deleteButton.className = "delete";

        deleteButton.onclick = function() {
            deleteQuestion(index);
        };

        item.appendChild(title);
        item.appendChild(details);
        item.appendChild(deleteButton);

        list.appendChild(item);

    });

}

document.getElementById("questionForm").addEventListener(
    "submit",
    function(event) {

        event.preventDefault();

        let newQuestion = {

            subject: document.getElementById("subject").value,

            question: document.getElementById("question").value,

            options: [
                document.getElementById("optionA").value,
                document.getElementById("optionB").value,
                document.getElementById("optionC").value,
                document.getElementById("optionD").value
            ],

            answer: Number(
                document.getElementById("correctAnswer").value
            )

        };

        adminQuestions.push(newQuestion);

        localStorage.setItem(
            "adminQuestions",
            JSON.stringify(adminQuestions)
        );

        this.reset();

        displayQuestions();

        alert("Question added successfully!");

    }
);

function deleteQuestion(index) {

    if (confirm("Are you sure you want to delete this question?")) {

        adminQuestions.splice(index, 1);

        localStorage.setItem(
            "adminQuestions",
            JSON.stringify(adminQuestions)
        );

        displayQuestions();

    }

}

displayQuestions();

</script>

</body>
</html>
